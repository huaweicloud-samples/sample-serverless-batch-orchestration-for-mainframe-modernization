# The environment contract of the batch container, applied by hand: replace
# REPLACE_ME with the data bucket of the deployment, the value of the terraform
# output data_bucket, and apply again after every apply that changes it.
#
# The names below are exactly the ones src/job/batch_job/settings.py reads from
# a container. A name this map does not carry is a run that stops in its own
# start-up check, and says which name is missing.
apiVersion: v1
kind: ConfigMap
metadata:
  name: batch-config
  namespace: batch-jobs
data:
  OBS_BUCKET: "REPLACE_ME"
  OBS_ENDPOINT: "https://obs.cn-north-4.myhuaweicloud.com"
  OBS_REGION: "cn-north-4"
  INBOUND_PREFIX: "inbound/transactions/"
  PROCESSING_PREFIX: "processing/"
  OUTBOUND_PREFIX: "outbound/"
  LOG_LEVEL: "INFO"
